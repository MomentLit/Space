openapi: 3.0.3
info:
  title: "Space API"
  description: "API specification for Space. Error response mapping is Needs confirmation because no global exception handler is visible."
  version: "0.1.0"
servers:
  - url: "Needs confirmation"
    description: "Needs confirmation"
tags:
  - name: "Spaces"
  - name: "Schedules"
  - name: "Internal"
paths:
  /internal/spaces:
    get:
      tags: ["Internal"]
      summary: "List all spaces for admin"
      description: "Internal endpoint for admins to list all non-deleted spaces regardless of approval status or active state. No filters. Requires a JWT whose role is ADMIN; otherwise 403."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "All non-deleted spaces returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSpaceListResponses"
        "403":
          description: "Requester is not an admin."
        default:
          description: "Needs confirmation"
  /internal/spaces/{space-id}:
    get:
      tags: ["Internal"]
      summary: "Get space detail for admin"
      description: "Internal endpoint for admins to get the detail of a non-deleted space regardless of approval status or active state. Requires a JWT whose role is ADMIN; otherwise 403."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: "Space detail returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSpaceDetailResponse"
        "403":
          description: "Requester is not an admin."
        "404":
          description: "Space not found or deleted."
        default:
          description: "Needs confirmation"
  /internal/spaces/{space-id}/matching-context:
    get:
      tags: ["Internal"]
      summary: "Get space matching context"
      description: "Internal endpoint used by Matching Service to resolve the host and validate approval, active state, and schedule availability."
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - name: start-time
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end-time
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: "Matching context returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMatchingContextResponse"
        default:
          description: "Needs confirmation"
  /internal/spaces/{space-id}/admin-status:
    get:
      tags: ["Internal"]
      summary: "Get space admin status"
      description: "Internal endpoint for admins to check the approval status of a non-deleted space. Requires a JWT whose role is ADMIN; otherwise 403."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: "Admin status returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceAdminStatusResponse"
        "403":
          description: "Requester is not an admin."
        "404":
          description: "Space not found or deleted."
        default:
          description: "Needs confirmation"
    patch:
      tags: ["Internal"]
      summary: "Update space admin status"
      description: "Internal endpoint for admins to change the approval status of a non-deleted space. Allowed only while the current status is PENDING. Requires a JWT whose role is ADMIN; otherwise 403."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceAdminStatusUpdateRequest"
      responses:
        "204":
          description: "Admin status updated."
        "400":
          description: "admin_status is missing or the space is not PENDING."
        "403":
          description: "Requester is not an admin."
        "404":
          description: "Space not found or deleted."
        default:
          description: "Needs confirmation"
  /spaces:
    post:
      tags: ["Spaces"]
      summary: "Create a space"
      description: "Creates a space for the authenticated host."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceCreateRequest"
      responses:
        "201":
          description: "Space created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceCreateApiResponse"
        default:
          description: "Needs confirmation"
    get:
      tags: ["Spaces"]
      summary: "List spaces"
      description: "Lists non-deleted spaces with optional name and category filters. Public by SecurityConfig."
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SpaceCategory"
      responses:
        "200":
          description: "Spaces returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceListApiResponse"
        default:
          description: "Needs confirmation"
  /spaces/me:
    get:
      tags: ["Spaces"]
      summary: "List my spaces"
      description: "Lists spaces owned by the authenticated host. SecurityConfig intends authentication, but matcher order may make this route public; Needs confirmation."
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SpaceCategory"
      responses:
        "200":
          description: "Owner spaces returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpaceListApiResponse"
        default:
          description: "Needs confirmation"
  /spaces/{space-id}:
    get:
      tags: ["Spaces"]
      summary: "Get space detail"
      description: "Returns a non-deleted space and image URLs. Public by SecurityConfig."
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: "Space detail returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceDetailApiResponse"
        default:
          description: "Needs confirmation"
    patch:
      tags: ["Spaces"]
      summary: "Update a space"
      description: "Updates an owned active space. Replaces image rows when image_urls is provided."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceUpdateRequest"
      responses:
        "204":
          description: "Space updated."
        default:
          description: "Needs confirmation"
    delete:
      tags: ["Spaces"]
      summary: "Delete a space"
      description: "Soft-deletes an owned active space and deletes related image and schedule rows."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "204":
          description: "Space deleted."
        default:
          description: "Needs confirmation"
  /spaces/{space-id}/schedule:
    post:
      tags: ["Schedules"]
      summary: "Create a schedule"
      description: "Creates an available schedule for an owned active space."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreateRequest"
      responses:
        "201":
          description: "Schedule created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleCreateApiResponse"
        default:
          description: "Needs confirmation"
    get:
      tags: ["Schedules"]
      summary: "List schedules"
      description: "Lists schedules for a non-deleted space, grouped by date and ordered by start time. Public by SecurityConfig."
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: "Schedules returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleListApiResponse"
        default:
          description: "Needs confirmation"
  /spaces/{space-id}/schedule/{schedule-id}:
    patch:
      tags: ["Schedules"]
      summary: "Update a schedule"
      description: "Updates an owned space schedule. Omitted fields keep existing values."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdateRequest"
      responses:
        "204":
          description: "Schedule updated."
        default:
          description: "Needs confirmation"
    delete:
      tags: ["Schedules"]
      summary: "Delete a schedule"
      description: "Deletes a schedule for an owned active space."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "204":
          description: "Schedule deleted."
        default:
          description: "Needs confirmation"
components:
  parameters:
    SpaceId:
      name: "space-id"
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ScheduleId:
      name: "schedule-id"
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ApiResponse:
      type: object
      properties:
        message:
          type: string
        data:
          nullable: true
    SpaceCategory:
      type: string
      enum: [PRACTICE_ROOM, STUDIO, MEETING_ROOM, PARTY_ROOM, CLASSROOM, POPUP_STORE, OFFICE, HALL, CAFE, OTHER]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    SpaceCreateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        address:
          $ref: "#/components/schemas/Address"
        thumbnail_url: { type: string }
        image_urls:
          type: array
          items: { type: string }
        price_per_hour: { type: integer, format: int32 }
        category:
          $ref: "#/components/schemas/SpaceCategory"
        phone: { type: string, nullable: true }
      description: "DTO has no field-level validation annotations in current code. Required fields are Needs confirmation."
    SpaceUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        address:
          $ref: "#/components/schemas/Address"
        ai_summary: { type: string }
        thumbnail_url: { type: string }
        image_urls:
          type: array
          items: { type: string }
        price_per_hour: { type: integer, format: int32 }
        category:
          $ref: "#/components/schemas/SpaceCategory"
        phone: { type: string }
    Address:
      type: object
      properties:
        sido: { type: string }
        sigungu: { type: string }
        eup_myeon_dong: { type: string, nullable: true }
        road_address: { type: string }
        jibun_address: { type: string, nullable: true }
        detail_address: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
    SpaceCreateResponse:
      type: object
      properties:
        space_id: { type: integer, format: int64 }
    SpaceAdminStatusUpdateRequest:
      type: object
      required: [admin_status]
      properties:
        admin_status:
          $ref: "#/components/schemas/ApprovalStatus"
      description: "admin_status is required by service validation."
    SpaceAdminStatusResponse:
      type: object
      properties:
        space_id: { type: integer, format: int64 }
        admin_status:
          $ref: "#/components/schemas/ApprovalStatus"
    SpaceMatchingContextResponse:
      type: object
      properties:
        space_id: { type: integer, format: int64 }
        host_id: { type: string }
        approved: { type: boolean }
        active: { type: boolean }
        available: { type: boolean }
    SpaceListResponse:
      type: object
      properties:
        space_id: { type: integer, format: int64 }
        name: { type: string }
        address:
          $ref: "#/components/schemas/Address"
        thumbnail_url: { type: string }
        price_per_hour: { type: integer, format: int32 }
        category: { type: string }
    SpaceListResponses:
      type: object
      properties:
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/SpaceListResponse"
    MySpaceListResponse:
      allOf:
        - $ref: "#/components/schemas/SpaceListResponse"
        - type: object
          properties:
            admin_status:
              type: string
              enum: [PENDING, APPROVED, REJECTED]
            is_active:
              type: boolean
    MySpaceListResponses:
      type: object
      properties:
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceListResponse"
    AdminSpaceListResponse:
      type: object
      properties:
        space_id: { type: integer, format: int64 }
        host_id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        ai_summary: { type: string, nullable: true }
        address:
          $ref: "#/components/schemas/Address"
        thumbnail_url: { type: string }
        price_per_hour: { type: integer, format: int32 }
        admin_status:
          $ref: "#/components/schemas/ApprovalStatus"
        is_active: { type: boolean }
        category: { type: string }
        phone: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminSpaceListResponses:
      type: object
      properties:
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/AdminSpaceListResponse"
    AdminSpaceDetailResponse:
      allOf:
        - $ref: "#/components/schemas/AdminSpaceListResponse"
        - type: object
          properties:
            image_urls:
              type: array
              items: { type: string }
    SpaceDetailResponse:
      type: object
      properties:
        space_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        ai_summary: { type: string, nullable: true }
        address:
          $ref: "#/components/schemas/Address"
        thumbnail_url: { type: string }
        image_urls:
          type: array
          items: { type: string }
        price_per_hour: { type: integer, format: int32 }
        category: { type: string }
    ScheduleCreateRequest:
      type: object
      properties:
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
      description: "start_time and end_time are required by entity validation and start_time must be before end_time."
    ScheduleUpdateRequest:
      type: object
      properties:
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        is_bookable: { type: boolean }
    ScheduleCreateResponse:
      type: object
      properties:
        schedule_id: { type: integer, format: int64 }
    ScheduleTimeBlockResponse:
      type: object
      properties:
        schedule_id: { type: integer, format: int64 }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        status:
          type: string
          enum: [AVAILABLE, BLOCKED]
    ScheduleListResponse:
      type: object
      properties:
        date: { type: string, format: date }
        time_blocks:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleTimeBlockResponse"
    ScheduleListResponses:
      type: object
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleListResponse"
    SpaceCreateApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { $ref: "#/components/schemas/SpaceCreateResponse" } }
    SpaceListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { $ref: "#/components/schemas/SpaceListResponses" } }
    MySpaceListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { $ref: "#/components/schemas/MySpaceListResponses" } }
    SpaceDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { $ref: "#/components/schemas/SpaceDetailResponse" } }
    ScheduleCreateApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { $ref: "#/components/schemas/ScheduleCreateResponse" } }
    ScheduleListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { $ref: "#/components/schemas/ScheduleListResponses" } }
  responses: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
